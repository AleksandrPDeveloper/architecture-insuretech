apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
  template:
    metadata:
      labels:
        app: locust
    spec:
      containers:
        - name: locust
          image: locustio/locust
          args:
            [
              "-f",
              "/mnt/locust/locustfile.py",
              "--web-host",
              "0.0.0.0",
              "--host",
              "http://scaletestapp:8080"
            ]
          ports:
            - containerPort: 8089
          volumeMounts:
            - name: locustfile-volume
              mountPath: /mnt/locust
      volumes:
        - name: locustfile-volume
          configMap:
            name: locustfile